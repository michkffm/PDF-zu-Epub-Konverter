[project]
name = "pdf-epub-converter"
version = "0.1.0"
description = "Professional PDF to EPUB converter with OCR support"
authors = [
    {name = "michkffm", email = "michael.koch@vodafone.de"}
]
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.9",
    "pytesseract>=0.3.10",
    "Pillow>=13.0.0",
    "ebooklib>=0.18.0",
    "lxml>=6.1.0",
    "PyQt6>=6.6.0",
]

[tool.poetry]
packages = [
    { include = "pdf_epub_converter", from = "src" }
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "black>=26.10.1",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
